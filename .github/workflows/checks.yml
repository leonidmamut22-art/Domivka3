name: Domivka checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: domivka_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: domivka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domivka_test -d domivka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Domivka_3/Domivka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r bot/requirements.txt
      - name: Validate Render blueprint
        run: |
          python -m pip install 'jsonschema>=4,<5' 'PyYAML>=6,<7'
          python tests/validate_blueprint.py
      - run: bash -n deploy/install.sh
      - run: python -m compileall -q bot
      - run: python -m unittest discover -s tests -v
      - name: PostgreSQL integration
        env:
          DOMIVKA_TEST_POSTGRES_URL: postgresql://domivka_test:disposable-ci-password@localhost:5432/domivka_test
        run: python -m unittest discover -s tests -p 'test_postgres.py' -v
      - run: node tests/check_frontend.mjs
      - name: Install disposable browser test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Browser smoke
        run: |
          python tests/browser_fixture.py > fixture.log 2>&1 &
          node tests/browser_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: domivka-browser-check
          path: |
            Domivka_3/Domivka/test-results/
            Domivka_3/Domivka/fixture.log
