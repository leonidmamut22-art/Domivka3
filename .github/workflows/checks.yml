name: Domivka checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Domivka_3/Domivka
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r bot/requirements.txt
      - run: python -m compileall -q bot
      - run: python -m unittest discover -s tests -v
      - run: node --check webapp/market.js
