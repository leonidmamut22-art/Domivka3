<script>
/* ═════ ДОМІВКА v3 · інтерактив і нові функції (підключається після основного скрипта) ═════ */
(()=>{
"use strict";
const q=(s,r=document)=>r.querySelector(s),raf=requestAnimationFrame;

/* ── 1. Нова картка: теги/серце більше не «їдуть» разом з фото, ціна й рейтинг як в Airbnb ── */

 <button class="ht" data-a="fav" data-id="${l.id}" aria-label="В обране">${l.fav?"❤️":"🤍"}</button><button class="cmpb ${CMPL.includes(l.id)?"on":""}" data-a="cmp" data-id="${l.id}" title="Порівняти">⚖️</button></div>
 <div class="in"><div class="trow"><div class="t">${esc(l.title)}</div>${l.rn?`<div class="rt">★ ${l.rating}<small>(${l.rn})</small></div>`:'<div class="rt new">Нове</div>'}</div>

 <div class="p">${l.disc?`<s>${uah(p)}</s>`:""}${uah(d)} <small>/${unitOf(l)}${F.month?"":l.pm?` · ${uah(l.pm)}/міс`:""}</small></div></div></article>`};

/* ── 2. Свайпи: мишкою можна гортати, крапки, стрілки, лічильник фото ── */
let cur=null;
function endDrag(){if(!cur)return;const {c,m}=cur;cur=null;c.style.cursor="";if(c.matches(".ph,.g,.slides")){const w=c.clientWidth,i=Math.round(c.scrollLeft/w);c.scrollTo({left:i*w,behavior:"smooth"})}
 setTimeout(()=>{c.style.scrollSnapType=""},350);c._m=m>6;setTimeout(()=>{c._m=false},80)}
addEventListener("pointermove",e=>{if(!cur)return;const dx=e.clientX-cur.x;cur.m=Math.max(cur.m,Math.abs(dx));cur.c.scrollLeft=cur.s-dx});
addEventListener("pointerup",endDrag);addEventListener("pointercancel",endDrag);
function dragify(c){c.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button)return;cur={c,x:e.clientX,s:c.scrollLeft,m:0};c.style.scrollSnapType="none";c.style.cursor="grabbing"});

function wheelX(c){c.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&c.scrollWidth>c.clientWidth){c.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false})}
function carousel(c){const n=c.querySelectorAll("img").length;if(n<2)return;const isG=c.classList.contains("g");let w=c.parentElement;
 if(isG){w=document.createElement("div");w.className="gw";c.parentNode.insertBefore(w,c);w.appendChild(c)}
 const ui=document.createElement("div");ui.className=isG?"cnt":"dots";ui.innerHTML=isG?`1 / ${n}`:'<i class="on"></i>'+"<i></i>".repeat(n-1);w.appendChild(ui);

 const upd=()=>{const i=Math.max(0,Math.min(n-1,Math.round(c.scrollLeft/(c.clientWidth||1))));if(isG)ui.textContent=`${i+1} / ${n}`;else[...ui.children].forEach((d,k)=>d.classList.toggle("on",k===i))};
 c.addEventListener("scroll",()=>raf(upd),{passive:true});
 w.addEventListener("click",e=>{const b=e.target.closest(".nav");if(!b)return;e.stopPropagation();e.preventDefault();c.scrollBy({left:(b.classList.contains("r")?1:-1)*c.clientWidth,behavior:"smooth"})},true)}
function enhance(){document.querySelectorAll(".ph:not([data-e]),.g:not([data-e])").forEach(c=>{c.dataset.e=1;dragify(c);carousel(c)});
 document.querySelectorAll(".chips:not([data-e]),.coll:not([data-e]),.slides:not([data-e]),.trust:not([data-e])").forEach(c=>{c.dataset.e=1;dragify(c);if(!c.matches(".slides"))wheelX(c)})}

/* ── 4. Безпека, чесні ціни ── */
const trust=`<div class="trust"><button data-v3="safe">🛡<b>Без шахраїв</b>як ми вас захищаємо</button><button data-v3="fees">🧾<b>Ціна без сюрпризів</b>жодних зборів для гостей</button><button data-v3="club">🎁<b>Клуб Домівки</b>бали й знижки</button></div>`;
const _dh=window.drawHero;window.drawHero=function(){_dh();const h=q("#hero");if(h&&h.querySelector(".coll")&&!h.querySelector(".trust"))h.querySelector(".coll").insertAdjacentHTML("afterend",trust)};
const rule=(i,t,s)=>`<div class="rule"><i>${i}</i><div><b>${t}</b><span>${s}</span></div></div>`;
const safeSheet=()=>sheet(`<div class="pad" style="padding-top:56px"><div class="h1">🛡 Як ми захищаємо від шахраїв</div><p class="mut" style="margin:8px 0 6px">Підроблені оголошення й передоплата «за квартиру-примару» — головна біда орендарів. Ось що працює в Домівці:</p>
 ${rule("✅","Верифіковані господарі","Документ і селфі перевіряє адміністратор. Значок «Перевірений» — на оголошенні.")}
 ${rule("🔒","Адреса й контакти — після підтвердження","Ніхто не отримає ваші дані без бронювання, а ви — адресу без згоди господаря.")}
 ${rule("💳","Передоплата лише так, як вказано в оголошенні","Не переказуйте гроші «на іншу картку з месенджера». Платіж — тільки за реквізитами, які бот показав після підтвердження.")}
 ${rule("🖼","Перевірка фото на крадіжку","Дублікати чужих знімків потрапляють на модерацію.")}
 ${rule("⭐","Відгуки в обидва боки","Гості оцінюють житло, господарі — гостей. Видно, хто чесний.")}
 ${rule("🚩","Скарга в один дотик","Підозріле оголошення? Поскаржтесь у його картці, адміністратор розбереться.")}
 <div class="h2">Червоні прапорці</div><div class="box warn">• Ціна явно нижча за ринкову<br>• Просять гроші до перегляду або відмовляються від відеодзвінка<br>• Тиснуть: «є ще п'ятеро охочих, платіть зараз»<br>• Пропонують піти «в офіс» платити за список квартир</div></div>`,"plain");
const feesSheet=()=>sheet(`<div class="pad" style="padding-top:56px"><div class="h1">🧾 Ціна без сюрпризів</div><p class="mut" style="margin:8px 0 6px">Найчастіша скарга на великі сервіси бронювання — «ціна росте на останньому кроці». У нас інакше:</p>
 ${rule("💯","Ціна в картці = ціна до сплати","Сервісного збору для гостей немає. Ви бачите повну суму ще до заявки.")}
 ${rule("📆","Прозорі правила скасування",`Безкоштовне скасування — за ${META.free_cancel||48} год до заїзду. Умови видно до бронювання.`)}
 ${rule("💬","Чат із господарем до рішення","Усі питання про деталі, опалення, світло й укриття — напряму, до оплати.")}
 ${rule("🤝","Платіж напряму","Гроші йдуть від гостя до господаря, платформа їх не тримає.")}</div>`,"plain");

/* ── 5. Pro-тариф і платне «Топ» через Telegram Stars ── */
function openInv(link,done){if(!tg.openInvoice)return toast("Оновіть Telegram, щоб оплатити Stars");tg.openInvoice(link,st=>{if(st==="paid"){HN("success");toast("✅ Оплачено!",3000);done&&done()}else if(st==="failed"){HN("error");toast("Оплата не пройшла")}})}
function proCard(){const v=q("#view");if(!v||TAB!=="me"||!ME||ME.role!=="host"||q("#procard")||!v.querySelector(".pg"))return;const d=document.createElement("div");d.id="procard";d.className="procard";d.dataset.v3="pro";
 d.innerHTML=ME.pro?`<b>💎 Домівка Pro активна</b><span>${ME.pro_until?`До ${dm(ME.pro_until)}. `:""}Значок довіри, до 50 оголошень, знижка на «Топ».</span><u>Керувати</u>`:`<b>💎 Домівка Pro</b><span>Для рієлторів і власників кількох квартир: до 50 оголошень, значок довіри, знижка на «Топ».</span><u>Дізнатися більше</u>`;v.insertBefore(d,v.firstChild)}
async function proSheet(){const s=sheet(`<div class="pad" style="padding-top:56px"><div class="h1">💎 Домівка Pro</div><div id="prb"><div class="sk" style="height:220px;margin-top:14px"></div></div></div>`,"plain");let P;
 try{P=await api("/api/pro")}catch(e){closeSheet(s);return toast(e.message)}
 const m=P.plans.find(x=>x.days===30),y=P.plans.find(x=>x.days===90),sv=m&&y?Math.round((1-y.stars/(3*m.stars))*100):0;
 q("#prb",s).innerHTML=`<p class="mut" style="margin:8px 0 8px">${P.pro?`Pro активний${P.until?` до ${dm(P.until)}`:""}. Можна продовжити.`:`Безкоштовно — до ${P.free} оголошень. Pro знімає обмеження.`}</p>
 <div class="perk"><i>🏢</i><div><b>До ${P.max} оголошень</b><span>Замість ${P.free}. Зараз у вас: ${P.listings}</span></div></div>
 <div class="perk"><i>💎</i><div><b>Значок Pro</b><span>Видно на всіх ваших оголошеннях: більше довіри й кліків</span></div></div>
 <div class="perk"><i>🔥</i><div><b>−${P.boost_off}% на «Топ»-просування</b><span>Піднімайте оголошення в пошуку дешевше</span></div></div>
 <div style="margin-top:14px">${P.plans.map(p=>`<button class="plan ${p.days===90?"pick":""}" data-plan="${p.days}"><div><b>${p.days===30?"1 місяць":"3 місяці"}</b><small>${p.days===90?`${Math.round(p.stars/3)} ⭐ на місяць${sv>0?` · економія ${sv}%`:""}`:"без зобов'язань"}</small></div><em>${p.stars} ⭐</em></button>`).join("")||'<div class="box">Тарифи ще не налаштовані.</div>'}</div>
 <p class="mut sm" style="margin-top:8px">Оплата Telegram Stars безпосередньо в Telegram. Підписка не поновлюється сама.</p>`;
 s.onclick=async e=>{const b=e.target.closest("[data-plan]");if(!b)return;HP();try{const r=await post("/api/pro/buy",{days:+b.dataset.plan});openInv(r.link,()=>{closeSheet(s);loadMe().then(()=>go("me"))})}catch(x){toast(x.message)}}}
function boostSheet(lid,P){const d={3:"3 дні",7:"7 днів",30:"30 днів"},off=P.pro?P.boost_off:0;
 const s=sheet(`<div class="pad" style="padding-top:56px"><div class="h1">🔥 Просунути в «Топ»</div><p class="mut" style="margin:8px 0 14px">Оголошення з позначкою «Топ» показуються першими й отримують найбільше переглядів.${off?` Ваша знижка Pro: −${off}%.`:""}</p>
 ${Object.entries(P.boost).map(([k,v])=>`<button class="plan ${k==="7"?"pick":""}" data-bd="${k}"><div><b>${d[k]}</b><small>${k==="7"?"найпопулярніший":k==="30"?"найвигідніше":"щоб спробувати"}</small></div><em>${off?Math.max(1,Math.floor(v*(100-off)/100)):v} ⭐</em></button>`).join("")}</div>`,"plain");
 s.onclick=async e=>{const b=e.target.closest("[data-bd]");if(!b)return;HP();try{const r=await post("/api/boost/buy",{lid,days:+b.dataset.bd});openInv(r.link,()=>{closeSheet(s);go("me")})}catch(x){toast(x.message)}}}
document.addEventListener("click",async e=>{const a=e.target.closest('[data-a="botlink"]');if(!a||!String(a.dataset.id||"").startsWith("b_"))return;e.stopImmediatePropagation();e.preventDefault();
 let P=null;try{P=await api("/api/pro")}catch(x){}if(!P||!Object.keys(P.boost||{}).length)return ACT.botlink(a,e);boostSheet(+a.dataset.id.slice(2),P)},true);
document.addEventListener("click",e=>{const b=e.target.closest("[data-v3]");if(!b)return;HP();const k=b.dataset.v3;if(k==="safe")safeSheet();else if(k==="fees")feesSheet();else if(k==="club")go("me");else if(k==="pro")proSheet()});

/* ── 6. Імпорт власного оголошення за посиланням ── */
const _nl=window.newListing;window.newListing=function(){_nl.apply(this,arguments);const s=SH[SH.length-1],h=s&&s.querySelector(".h1");if(!h)return;window.NL.urls=[];
 h.insertAdjacentHTML("afterend",`<div class="imp"><b>🔗 Швидко: імпорт із посилання</b><div class="mut sm" style="margin:4px 0 8px">Вставте посилання на своє оголошення (OLX, DOM.RIA, сайт агентства): заповнимо форму й підтягнемо фото.</div>
 <div class="row" style="gap:8px"><input id="imu" inputmode="url" placeholder="https://…"><button class="cta s" id="imb">Імпорт</button></div>
 <label class="chk"><input type="checkbox" id="imc"><span>Це моє оголошення, я маю право публікувати його текст і фото</span></label><div id="imi"></div><div class="impv" id="imv"></div></div>`)};
const _api=window.api;window.api=function(path,o={}){if(path==="/api/host/new"&&o.form&&window.NL&&NL.urls&&NL.urls.length)o.form.append("photo_urls",JSON.stringify(NL.urls));return _api(path,o)};
const impv=()=>{const v=q("#imv");if(v)v.innerHTML=NL.urls.map((u,i)=>`<div style="background-image:url('${esc(u)}')"><b data-ri="${i}">✕</b></div>`).join("")};
document.addEventListener("click",async e=>{const r=e.target.closest("[data-ri]");if(r){NL.urls.splice(+r.dataset.ri,1);return impv()}
 const b=e.target.closest("#imb");if(!b)return;const url=q("#imu").value.trim();if(!/^https?:\/\//i.test(url))return toast("Вставте повне посилання з https://");if(!q("#imc").checked)return toast("Підтвердьте, що це ваше оголошення");
 b.disabled=true;b.textContent="…";HP();
 try{const d=await post("/api/host/import",{url}),set=(id,v)=>{const el=q(id);if(el&&v&&!el.value)el.value=v};set("#n1",d.title);set("#n6",d.descr);set("#n2",d.city);
  const txt=(d.title+" "+d.descr).toLowerCase();if(d.price&&(!d.currency||d.currency==="UAH"))set(/міс|month/.test(txt)||d.price>=8000?"#n5":"#n4",String(Math.round(d.price)));
  if(d.rooms){NL.r=Math.max(1,Math.min(20,d.rooms));const vr=q("#vr");if(vr)vr.textContent=NL.r}
  NL.urls=(d.photos||[]).slice(0,6);impv();q("#imi").innerHTML=`<div class="box ok" style="margin:10px 0 0">✅ Імпортовано з ${esc(d.source)}. Перевірте дані${NL.urls.length?`, фото: ${NL.urls.length}`:""}${d.price&&d.currency&&d.currency!=="UAH"?`. Ціна у валюті ${esc(d.currency)}: вкажіть гривні вручну`:""}.</div>`;HN("success")}
 catch(x){q("#imi").innerHTML=`<div class="box bad" style="margin:10px 0 0">${esc(x.message)}</div>`;HN("error")}
 b.disabled=false;b.textContent="Імпорт"},true);

/* ── 7. Спостерігач: нові блоки на екрані отримують інтерактив ── */
let t;const mo=new MutationObserver(()=>{cancelAnimationFrame(t);t=raf(()=>{enhance();proCard()})});
["#view","#sheets"].forEach(s=>{const n=q(s);n&&mo.observe(n,{childList:true,subtree:true})});enhance();
})();

</script><script src="/assets/market.js"></script></body></html>
